name: Weekly Crawl

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:      # Manual trigger
    inputs:
      diagnostic_only:
        description: 'Probe public source without modifying the archive'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Probe source connectivity
        run: |
          for url in 'https://yinwang.org/' 'https://yinwang.org/api/v1/posts?skip=0&limit=20'; do
            echo "Probing $url"
            curl --silent --show-error --location --connect-timeout 15 --max-time 30 --output /dev/null --write-out 'HTTP=%{http_code} DNS=%{time_namelookup}s TCP=%{time_connect}s TLS=%{time_appconnect}s TTFB=%{time_starttransfer}s\n' "$url" || echo "curl exit=$?"
          done

      - name: Set up Racket
        if: ${{ !inputs.diagnostic_only }}
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install dependencies
        if: ${{ !inputs.diagnostic_only }}
        run: raco pkg install --auto --no-docs markdown http-easy

      - name: Install package
        if: ${{ !inputs.diagnostic_only }}
        run: raco pkg install --auto --no-docs --link "$(pwd)"

      - name: Run crawler
        if: ${{ !inputs.diagnostic_only }}
        run: raco yinwang-archive crawl

      - name: Lint posts
        if: ${{ !inputs.diagnostic_only }}
        run: raco yinwang-archive lint

      - name: Notify new posts
        if: ${{ !inputs.diagnostic_only }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: raco yinwang-archive notify

      - name: Check for changes
        if: ${{ !inputs.diagnostic_only }}
        id: check
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: ${{ !inputs.diagnostic_only && steps.check.outputs.has_changes == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "docs: crawl update ${DATE}"
          git push
