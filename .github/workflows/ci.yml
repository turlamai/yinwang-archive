name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install dependencies
        run: raco pkg install --auto --no-docs markdown http-easy

      - name: Install package
        run: raco pkg install --auto --no-docs --link "$(pwd)"

      - name: Run tests
        run: raco test -p yinwang-archive

      - name: Lint posts
        run: raco yinwang-archive lint

      - name: Build the site
        run: raco yinwang-archive build
